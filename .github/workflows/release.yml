name: Release

# Publica no PyPI quando uma tag v* e' empurrada (ex: v0.7.2).
# Usa PyPI Trusted Publishing (OIDC) — SEM token/secret no repo.
# Pre-requisito (1x, no PyPI): cadastrar este repo+workflow como Trusted
# Publisher do projeto `tcf-format`
# (https://docs.pypi.org/trusted-publishers/). Enquanto nao cadastrado,
# o passo de publish falha de forma explicita (build/gate continuam validos).
#
# Versionamento (ADR-0024): a tag e' o contador de release (desacoplado do
# formato #TCF.N). Antes de taggear: bumpar `version` no pyproject.toml e
# garantir CI verde no commit alvo.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # A TAG E' O CAMINHO QUE PUBLICA — a barra aqui nao pode ser menor que a do
      # push. O ci.yml roda em push/PR para main e NAO dispara em tag, entao tudo
      # que ele garante precisa ser repetido: suite completa e o gate real-world.
      # (Antes daqui so' saia `test_regression_v1_baseline.py`: o mini-suite
      # D1-D9+D17a, que o AGENTS.md §4 declara insuficiente — "o candidato
      # prune-k-03 passou nele e regrediu +0.59% em real-world".)
      - name: Instalar deps
        run: uv pip install --system -e ".[dev]"

      # A tag e' o unico artefato que carrega a versao; se ela mentir, o PyPI
      # recebe um numero que nao corresponde ao codigo — e versao no PyPI nao
      # se reaproveita. Conferir ANTES de gastar build.
      - name: Conferir que a tag bate com a versao declarada
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          PKG=$(python -c "import tcf;print(tcf.__version__)")
          echo "tag=$TAG  pyproject=$PROJ  tcf.__version__=$PKG"
          test "$TAG" = "$PROJ" || { echo "::error::tag v$TAG != pyproject $PROJ"; exit 1; }
          test "$TAG" = "$PKG"  || { echo "::error::tag v$TAG != tcf.__version__ $PKG"; exit 1; }

      - name: Suite completa
        env:
          PYTHONHASHSEED: '0'
        run: uv run pytest -q

      - name: Gates byte-canonical (D1-D9 + D17a + REAL-WORLD)
        env:
          PYTHONHASHSEED: '0'
        run: |
          uv run pytest tests/test_regression_v1_baseline.py \
                        tests/test_real_world_snapshots.py -v --tb=short

      # WHEEL UNIVERSAL, DE PROPOSITO (decisao de release, nao de codigo).
      # O hook de build compila o acelerador Cython quando ha' compilador — o que
      # produziria aqui uma wheel `cp3XX-manylinux`, servivel SO' pra Linux naquele
      # Python exato. Todo o resto (Windows, macOS, outros minors) cairia no sdist.
      # Publicar UMA wheel universal + o sdist e' o que o 0.7.1 ja' fazia
      # (`py3-none-any`) e mantem a instalacao previsivel em toda a matriz
      # suportada (3.10-3.13). O acelerador continua best-effort na instalacao
      # via sdist, e o fallback pure-Python e' byte-equivalente (ADR-0020,
      # guardado por tests/test_pyx_byte_equivalence.py no ci.yml).
      # Matriz de wheels compiladas (cibuildwheel) e' item do .9 —
      # T-DIST-RELEASE-0.8.0, criterio "estrategia Cython reconciliada".
      - name: Build sdist + wheel (universal, sem extensao compilada)
        env:
          TCF_SKIP_ACCEL: '1'
        run: uv build

      - name: Conferir que a wheel saiu UNIVERSAL
        run: |
          ls -la dist/
          test -n "$(ls dist/*-py3-none-any.whl 2>/dev/null)" || {
            echo "::error::a wheel saiu especifica de plataforma; esperado py3-none-any"
            exit 1
          }

      # A wheel publicada tem de importar e fazer round-trip — nao basta compilar.
      # Em venv LIMPO: se a wheel depender de algo que so' existe na arvore do
      # repo, aqui quebra. `cd /tmp` garante que o import vem da wheel instalada
      # e nao do ./src. A versao esperada vai por ENV (nao por interpolacao dentro
      # de aspas simples do Python, que nao expande).
      - name: Smoke da wheel construida
        env:
          ESPERADA: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import os, tcf
          esperada = os.environ["ESPERADA"].lstrip("v")
          t = {"a": ["1", "2", "3"], "b": ["x", "y", "z"]}
          assert tcf.decode(tcf.encode(t)) == t, "round-trip da wheel falhou"
          assert tcf.__version__ == esperada, f"wheel {tcf.__version__} != tag {esperada}"
          print("smoke OK —", tcf.__version__)
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC pro Trusted Publishing (sem token)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
