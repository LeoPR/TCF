<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <rect width="1000" height="400" fill="#fbfaf8"/>
  <text x="60" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" fill="#1a1a1a" font-weight="600" text-anchor="start" xml:space="preserve">A query materializes only what it needs</text>
  <text x="60" y="102" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#6b6b6b" text-anchor="start" xml:space="preserve">view(blob).where("cidade", "Sao Paulo").sum("valor")</text>
  <rect x="60" y="140" width="330" height="86" rx="3" fill="#d8d4cc"/>
  <text x="225" y="186" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#6b6b6b" font-weight="600" text-anchor="middle" xml:space="preserve">cliente · plano</text>
  <text x="225" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6b6b6b" text-anchor="middle" xml:space="preserve">never decompressed</text>
  <rect x="410" y="140" width="250" height="86" rx="3" fill="#0b6b52"/>
  <text x="535" y="186" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#fbfaf8" font-weight="600" text-anchor="middle" xml:space="preserve">cidade</text>
  <text x="535" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fbfaf8" text-anchor="middle" xml:space="preserve">materialized to filter</text>
  <rect x="680" y="140" width="250" height="86" rx="3" fill="#084f3d"/>
  <text x="805" y="186" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#fbfaf8" font-weight="600" text-anchor="middle" xml:space="preserve">valor</text>
  <text x="805" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fbfaf8" text-anchor="middle" xml:space="preserve">materialized and summed</text>
  <text x="60" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="44" fill="#0b6b52" font-weight="600" text-anchor="start" xml:space="preserve">39.9%</text>
  <text x="230" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1a1a1a" text-anchor="start" xml:space="preserve">of the blob was read</text>
  <text x="230" y="322" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#6b6b6b" text-anchor="start" xml:space="preserve">55 B / 138 B</text>
  <line x1="60" y1="348" x2="940" y2="348" stroke="#d8d4cc" stroke-width="1"/>
  <text x="60" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#6b6b6b" text-anchor="start" xml:space="preserve">Real view.report() output after the filtered sum.</text>
</svg>
